<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ASM Hardware | Admin Dashboard</title>

<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 20px;
  background: #101010;
  color: white;
  font-family: Arial, sans-serif;
}
header {
  text-align: center;
  padding: 20px 0;
  border-bottom: 3px solid #e60000;
}
h1, h2 { color: #ff3030; }
main { max-width: 650px; margin: 25px auto; }
.card {
  background: #1d1d1d;
  border: 1px solid #383838;
  border-radius: 12px;
  padding: 20px;
  margin-bottom: 20px;
}
input, textarea {
  display: block;
  width: 100%;
  padding: 12px;
  margin: 10px 0;
  border-radius: 6px;
  border: 1px solid #555;
  background: #292929;
  color: white;
}
button {
  padding: 12px 16px;
  margin: 5px 3px 5px 0;
  border: 0;
  border-radius: 6px;
  background: #e60000;
  color: white;
  font-weight: bold;
  cursor: pointer;
}
.secondary { background: #444; }
.danger { background: #a00000; }
.hidden { display: none; }
.product {
  background: #292929;
  border-radius: 8px;
  padding: 15px;
  margin: 12px 0;
  overflow-wrap: anywhere;
}
.product img {
  max-width: 150px;
  max-height: 130px;
  display: block;
}
.status { color: #ffb3b3; overflow-wrap: anywhere; }
</style>
</head>

<body>
<header>
  <h1>ASM HARDWARE & ELECTRICALS</h1>
  <p>Admin Dashboard</p>
</header>

<main>
  <section id="login" class="card">
    <h2>Admin Login</h2>
    <form id="loginForm">
      <input id="email" type="email" placeholder="Admin email" required>
      <input id="password" type="password" placeholder="Password" required>
      <button type="submit">Login</button>
    </form>
    <p id="loginStatus" class="status"></p>
  </section>

  <section id="dashboard" class="hidden">
    <div class="card">
      <h2>Welcome, Admin</h2>
      <p id="userEmail"></p>
      <button id="logout" class="secondary">Logout</button>
    </div>

    <div class="card">
      <h2 id="formTitle">Add Product</h2>
      <form id="productForm">
        <input id="name" placeholder="Product name" required>
        <input id="category" placeholder="Category" required>
        <input id="price" type="number" min="0" step="0.01"
          placeholder="Price" required>
        <input id="stock" type="number" min="0" step="1"
          placeholder="Stock quantity" required>
        <input id="imageUrl" type="url"
          placeholder="Product image URL (optional)">
        <textarea id="description"
          placeholder="Product description"></textarea>
        <button id="saveButton" type="submit">Add Product</button>
        <button id="cancelEdit" type="button"
          class="secondary hidden">Cancel Edit</button>
      </form>
      <p id="productStatus" class="status"></p>
    </div>

    <div class="card">
      <h2>Shop Products</h2>
      <div id="products">Loading products...</div>
    </div>
  </section>
</main>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDHgIV51pum2Aylf8eIddiRiqxLd9CpsSs",
  authDomain: "asm-hardware-admin.firebaseapp.com",
  projectId: "asm-hardware-admin",
  storageBucket: "asm-hardware-admin.firebasestorage.app",
  messagingSenderId: "48329176974",
  appId: "1:48329176974:web:5e55bba043e5d3a54856df"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

let editingId = null;
let unsubscribe = null;

const $ = id => document.getElementById(id);

$("loginForm").addEventListener("submit", async event => {
  event.preventDefault();
  $("loginStatus").textContent = "Signing in...";

  try {
    await auth.signInWithEmailAndPassword(
      $("email").value.trim(),
      $("password").value
    );
    $("loginStatus").textContent = "";
  } catch (error) {
    $("loginStatus").textContent = "Login failed: " + error.message;
  }
});

auth.onAuthStateChanged(user => {
  if (unsubscribe) {
    unsubscribe();
    unsubscribe = null;
  }

  $("login").classList.toggle("hidden", !!user);
  $("dashboard").classList.toggle("hidden", !user);

  if (user) {
    $("userEmail").textContent = "Signed in as " + user.email;
    loadProducts();
  } else {
    $("products").textContent = "";
  }
});

$("logout").addEventListener("click", () => auth.signOut());

$("productForm").addEventListener("submit", async event => {
  event.preventDefault();
  $("productStatus").textContent = "Saving...";

  const price = Number($("price").value);
  const stock = Number($("stock").value);

  if (!Number.isFinite(price) || price < 0 ||
      !Number.isInteger(stock) || stock < 0) {
    $("productStatus").textContent = "Check the price and stock.";
    return;
  }

  const product = {
    name: $("name").value.trim(),
    category: $("category").value.trim(),
    price,
    stock,
    imageUrl: $("imageUrl").value.trim(),
    description: $("description").value.trim(),
    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
  };

  try {
    if (editingId) {
      await db.collection("products").doc(editingId).update(product);
      $("productStatus").textContent = "Product updated!";
    } else {
      product.createdAt = firebase.firestore.FieldValue.serverTimestamp();
      await db.collection("products").add(product);
      $("productStatus").textContent = "Product added!";
    }
    resetForm();
  } catch (error) {
    $("productStatus").textContent = "Error: " + error.message;
  }
});

function loadProducts() {
  $("products").textContent = "Loading products...";

  unsubscribe = db.collection("products").orderBy("name")
    .onSnapshot(snapshot => {
      $("products").replaceChildren();

      if (snapshot.empty) {
        $("products").textContent = "No products added yet.";
        return;
      }

      snapshot.forEach(doc => {
        const p = doc.data();
        const item = document.createElement("div");
        item.className = "product";

        if (p.imageUrl) {
          const img = document.createElement("img");
          img.src = p.imageUrl;
          img.alt = p.name || "Product";
          img.onerror = () => img.remove();
          item.appendChild(img);
        }

        const title = document.createElement("h3");
        title.textContent = p.name || "Product";
        item.appendChild(title);

        const details = document.createElement("p");
        details.textContent =
          "Category: " + (p.category || "") +
          " | Price: " + p.price +
          " | Stock: " + p.stock;
        item.appendChild(details);

        const description = document.createElement("p");
        description.textContent = p.description || "";
        item.appendChild(description);

        const edit = document.createElement("button");
        edit.textContent = "Edit";
        edit.className = "secondary";
        edit.onclick = () => editProduct(doc.id, p);

        const remove = document.createElement("button");
        remove.textContent = "Delete";
        remove.className = "danger";
        remove.onclick = async () => {
          if (confirm("Delete " + (p.name || "this product") + "?")) {
            try {
              await db.collection("products").doc(doc.id).delete();
              $("productStatus").textContent = "Product deleted.";
            } catch (error) {
              $("productStatus").textContent = error.message;
            }
          }
        };

        item.append(edit, remove);
        $("products").appendChild(item);
      });
    }, error => {
      $("products").textContent = "Database error: " + error.message;
    });
}

function editProduct(id, p) {
  editingId = id;
  $("name").value = p.name || "";
  $("category").value = p.category || "";
  $("price").value = p.price ?? "";
  $("stock").value = p.stock ?? "";
  $("imageUrl").value = p.imageUrl || "";
  $("description").value = p.description || "";
  $("formTitle").textContent = "Edit Product";
  $("saveButton").textContent = "Save Changes";
  $("cancelEdit").classList.remove("hidden");
  window.scrollTo({top: 0, behavior: "smooth"});
}

function resetForm() {
  editingId = null;
  $("productForm").reset();
  $("formTitle").textContent = "Add Product";
  $("saveButton").textContent = "Add Product";
  $("cancelEdit").classList.add("hidden");
}

$("cancelEdit").addEventListener("click", resetForm);
</script>
</body>
</html>
